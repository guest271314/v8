name: Build V8 d8 Shell (Native Host Target)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_d8_native:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        run: |
          echo "Cleaning up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils pkg-config ccache ninja-build

      - name: Checkout V8 Source
        uses: actions/checkout@v4
        with:
          path: v8

      - name: Install Google Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      - name: Configure Gclient and Sync Dependencies
        run: |
          export PATH="$(pwd)/depot_tools:$PATH"
          gclient config --spec 'solutions = [{ "name": "v8", "url": "https://github.com{{ github.repository }}.git", "deps_file": "DEPS", "managed": False }]'
          cd v8
          gclient sync --force --no-history --noprehooks
          gclient runhooks

      - name: Install V8 Build Dependencies
        run: |
          cd v8
          export DEBIAN_FRONTEND=noninteractive
          sudo ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-nacl

      - name: Generate GN Build Configurations
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          
          # Hybrid Profiling Configuration Map
          # Combines high release optimizations with explicit AST and bytecode diagnostics
          gn gen out/release --args='
            is_debug=false 
            target_cpu="x64"
            v8_monolithic=true
            is_component_build=false
            v8_use_external_startup_data=true
            v8_use_snapshot=true
            v8_enable_jit=false
            v8_enable_embedded_builtins=false
            symbols_include_type="none"
            blink_symbol_level=0
            v8_symbol_level=0
            v8_enable_i18n_support=false
            v8_enable_webassembly=true
            v8_enable_sandbox=false
            v8_enable_temporal_support=false
            enable_rust=false
            treat_warnings_as_errors=false
            
            v8_enable_disassembler=true
            v8_object_print=true
            v8_trace_maps=true
            dcheck_always_on=false
          '

      - name: Compile Native Tools and Engine Shell via Ninja
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          # Compiles d8 along with the required mksnapshot utility binary
          ninja -C out/release d8 mksnapshot

      - name: Verify Tracing Framework Capabilities
        run: |
          # Automated check proving the release tracing binary accepts bytecode commands smoothly
          ./v8/out/release/d8 --print-bytecode -e "const x = 1 + 2;"

      - name: Archive Native Output Binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-d8-tracing-engine
          path: |
            v8/out/release/d8
            v8/out/release/mksnapshot
