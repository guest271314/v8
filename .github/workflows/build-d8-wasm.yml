name: Build V8 d8 Shell to WASM (WASI Target)

on:
  push:
    branches: [ wasm-build ]
  pull_request:
    branches: [ wasm-build ]
  workflow_dispatch:

env:
  WASI_SDK_VERSION: "25"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_d8_wasm:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        run: |
          echo "Cleaning up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils pkg-config ccache ninja-build

      - name: Checkout V8 Fork Source
        uses: actions/checkout@v4
        with:
          path: v8

      - name: Download WASI SDK
        run: |
          curl -sSLo wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz"
          tar -xzf wasi-sdk.tar.gz
          echo "$(pwd)/wasi-sdk/bin" >> $GITHUB_PATH

      - name: Install Google Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      - name: Configure Gclient and Sync Dependencies
        run: |
          export PATH="$(pwd)/depot_tools:$PATH"
          gclient config --spec 'solutions = [{ "name": "v8", "url": "https://github.com{{ github.repository }}.git", "deps_file": "DEPS", "managed": False }]'
          cd v8
          gclient sync --force --no-history --noprehooks
          gclient runhooks

      - name: Install V8 Build Dependencies
        run: |
          cd v8
          export DEBIAN_FRONTEND=noninteractive
          sudo ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-nacl
      
      - name: Generate GN Build Configurations
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          
          # Paths to your extracted WASI SDK toolchain binaries
          WASI_BIN="$(pwd)/../wasi-sdk-25.0-x86_64-linux/bin"
          WASI_SYSROOT="$(pwd)/../wasi-sdk-25.0-x86_64-linux/share/wasi-sysroot"
          
          # Added v8_enable_temporal_support=false to resolve the sub-assertion
          gn gen out/wasm.release --args="
            is_debug=false 
            target_cpu=\"x64\"
            v8_target_cpu=\"x64\"
            v8_monolithic=true
            is_component_build=false
            v8_use_external_startup_data=false
            v8_use_snapshot=false
            v8_enable_jit=false
            v8_enable_embedded_builtins=false
            symbols_include_type=\"none\"
            blink_symbol_level=0
            v8_symbol_level=0
            v8_enable_i18n_support=false
            v8_enable_webassembly=false
            v8_enable_sandbox=false
            v8_enable_temporal_support=false
            enable_rust=false
            use_custom_libcxx=false
            clang_use_chrome_plugins=false
            
            ar=\"$WASI_BIN/llvm-ar\"
            nm=\"$WASI_BIN/llvm-nm\"
            cc=\"$WASI_BIN/clang --target=wasm32-wasi --sysroot=$WASI_SYSROOT\"
            cxx=\"$WASI_BIN/clang++ --target=wasm32-wasi --sysroot=$WASI_SYSROOT\"
          "

      - name: Compile Monolithic V8 Static Engine
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          ninja -C out/wasm.release v8_monolithic

      - name: Cross-Compile d8 to Standalone WASM Module
        run: |
          WASI_CLANG="$(pwd)/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux/bin/clang++"
          WASI_SYSROOT="$(pwd)/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux/share/wasi-sysroot"
          
          $WASI_CLANG -O3 \
            --target=wasm32-wasi \
            --sysroot=$WASI_SYSROOT \
            -I./v8/include \
            -I./v8 \
            v8/src/d8/d8.cc \
            -L./v8/out/wasm.release/obj \
            -Wl,--allow-undefined \
            -lv8_monolithic \
            -ldl -pthread \
            -o d8.wasm

