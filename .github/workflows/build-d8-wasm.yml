name: Build V8 d8 Shell to WASM (WASI Target)

on:
  push:
    branches: [wasm-build]
  pull_request:
    branches: [wasm-build]
  workflow_dispatch:

env:
  WASI_SDK_VERSION: "25"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_d8_wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Disk Space
        run: |
          echo "Cleaning up runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Add the i386 architecture configuration
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Install the missing 32-bit execution libraries
          sudo apt-get install -y git python3 curl xz-utils pkg-config ccache ninja-build libatomic1:i386 gcc-multilib g++-multilib

      - name: Checkout V8 Fork Source
        uses: actions/checkout@v4
        with:
          path: v8

      - name: Download WASI SDK
        run: |
          curl -sSLo wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz"
          tar -xzf wasi-sdk.tar.gz
          echo "$(pwd)/wasi-sdk/bin" >> $GITHUB_PATH

      - name: Install Google Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      - name: Configure Gclient and Sync Dependencies
        run: |
          export PATH="$(pwd)/depot_tools:$PATH"
          gclient config --spec 'solutions = [{ "name": "v8", "url": "https://github.com{{ github.repository }}.git", "deps_file": "DEPS", "managed": False }]'
          cd v8
          gclient sync --force --no-history --noprehooks
          gclient runhooks

      - name: Install V8 Build Dependencies
        run: |
          cd v8
          export DEBIAN_FRONTEND=noninteractive
          sudo ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-nacl

      - name: Patch V8 Source Location Fallbacks
        run: |
          cat << 'EOF' > v8/include/v8-source-location.h
          #ifndef INCLUDE_V8_SOURCE_LOCATION_H_
          #define INCLUDE_V8_SOURCE_LOCATION_H_
          #include <string>
          #include "v8config.h"
          #define V8_SUPPORTS_SOURCE_LOCATION 0
          namespace v8 {
          class V8_EXPORT SourceLocation final {
           public:
            static constexpr SourceLocation Current() { return SourceLocation(); }
            static constexpr SourceLocation CurrentIfDebug() { return SourceLocation(); }
            constexpr SourceLocation() : file_(nullptr), function_(nullptr), line_(0) {}
            constexpr const char* Function() const { return function_; }
            constexpr const char* FileName() const { return file_; }
            constexpr size_t Line() const { return line_; }
            constexpr explicit operator bool() const noexcept { return file_ != nullptr; }
            std::string ToString() const;
           private:
            const char* file_;
            const char* function_;
            size_t line_;
          };
          } // namespace v8
          #endif  // INCLUDE_V8_SOURCE_LOCATION_H_
          EOF

      - name: Patch Internal Source Location Interface
        run: |
          cat << 'EOF' > v8/src/codegen/source-location.h
          #ifndef V8_CODEGEN_SOURCE_LOCATION_H_
          #define V8_CODEGEN_SOURCE_LOCATION_H_
          #include <string>
          namespace v8 {
          namespace internal {
          class SourceLocation final {
           public:
            static constexpr SourceLocation Current() { return SourceLocation(); }
            static constexpr SourceLocation CurrentIfDebug() { return SourceLocation(); }
            constexpr SourceLocation() : file_(nullptr), function_(nullptr), line_(0) {}
            constexpr const char* Function() const { return function_; }
            constexpr const char* FileName() const { return file_; }
            constexpr size_t Line() const { return line_; }
            constexpr explicit operator bool() const noexcept { return file_ != nullptr; }
            std::string ToString() const { return file_ ? std::string(file_) + ":" + std::to_string(line_) : ""; }
           private:
            const char* file_;
            const char* function_;
            size_t line_;
          };
          } // namespace internal
          } // namespace v8
          #endif  // V8_CODEGEN_SOURCE_LOCATION_H_
          EOF

      - name: Patch V8 API Implementation Overlaps
        run: |
          sed -i '/std::string SourceLocation::ToString() const {/,/^}/c\std::string SourceLocation::ToString() const { return file_ ? std::string(file_) + ":" + std::to_string(line_) : ""; }' v8/src/api/api.cc

      - name: Patch Missing Std Bit Cast Macros
        run: |
          sed -i 's/return std::bit_cast<Dest, Source>(source);/return __builtin_bit_cast(Dest, source);/' v8/src/base/macros.h

      - name: Patch Missing std::make_unique_for_overwrite
        run: |
          cat << 'EOF' >> v8/src/base/macros.h

          #ifndef _WASI_UNIQUE_OVERWRITE_GUARD_
          #define _WASI_UNIQUE_OVERWRITE_GUARD_
          namespace std {
          template <typename T>
          inline typename enable_if<is_array<T>::value && extent<T>::value == 0, unique_ptr<T>>::type
          make_unique_for_overwrite(size_t n) {
              typedef typename remove_extent<T>::type U;
              return unique_ptr<T>(new U[n]);
          }
          }
          #endif
          EOF

      - name: Patch Missing std::make_unique_for_overwrite inside BigInt
        run: |
          cat << 'EOF' >> v8/src/bigint/bigint.h

          #ifndef _WASI_UNIQUE_OVERWRITE_GUARD_
          #define _WASI_UNIQUE_OVERWRITE_GUARD_
          namespace std {
          template <typename T>
          inline typename enable_if<is_array<T>::value && extent<T>::value == 0, unique_ptr<T>>::type
          make_unique_for_overwrite(size_t n) {
              typedef typename remove_extent<T>::type U;
              return unique_ptr<T>(new U[n]);
          }
          }
          #endif
          EOF

      - name: Patch Explicit Types for std::atomic_ref CTAD
        run: |
          sed -i 's/std::atomic_ref(const_cast<uint16_t&>(half))/std::atomic_ref<uint16_t>(const_cast<uint16_t\&>(half))/' v8/src/heap/cppgc-internal/heap-object-header.h

      - name: Patch C++20 ostringstream view Method Fallbacks
        run: |
          sed -i 's/\.view()/\.str()/g' v8/src/d8/d8.cc

      - name: Patch out Multi-Threaded Workers for WASI compatibility
        run: |
          sed -i 's/class Worker :/class __attribute__((visibility("hidden"))) Worker :/g' v8/src/d8/d8.cc
          sed -i '/global_template->Set(isolate, "Worker",/d' v8/src/d8/d8.cc

      - name: Generate GN Build Configurations
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          
          gn gen out/wasm.release --args="
            is_debug=false 
            target_cpu=\"x86\"
            v8_target_cpu=\"x86\"
            v8_monolithic=true
            is_component_build=false
            v8_use_external_startup_data=false
            v8_use_snapshot=false
            v8_enable_jit=false
            v8_enable_embedded_builtins=false
            v8_control_flow_integrity=false
            symbols_include_type=\"none\"
            blink_symbol_level=0
            v8_symbol_level=0
            v8_enable_i18n_support=false
            v8_enable_webassembly=false
            v8_enable_sandbox=false
            v8_enable_temporal_support=false
            enable_rust=false
            use_custom_libcxx=false
            clang_use_chrome_plugins=false
            treat_warnings_as_errors=false
            
            extra_cflags_cc=\"-std=c++20 -DV8_SUPPORTS_SOURCE_LOCATION=0\"
          "

      - name: Compile Monolithic 32-Bit Interpreter Static Archive
        run: |
          cd v8
          export PATH="$(pwd)/../depot_tools:$PATH"
          ninja -C out/wasm.release v8_monolith

      - name: Generate Workerless Standalone WASI Shell
        run: |
          cat << 'EOF' > v8/src/d8/wasm_shell.cc
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "include/libv8.h"
          #include "include/v8-context.h"
          #include "include/v8-initialization.h"
          #include "include/v8-isolate.h"
          #include "include/v8-local-handle.h"
          #include "include/v8-primitive.h"
          #include "include/v8-script.h"
          #include "include/v8-template.h"

          namespace v8 {
          class Shell {
           public:
            static void ReadStdinBytes(const v8::FunctionCallbackInfo<v8::Value>& args);
            static void WriteStdoutBytes(const v8::FunctionCallbackInfo<v8::Value>& args);
          };
          }

          int main(int argc, char* argv[]) {
              if (argc < 2) {
                  fprintf(stderr, "Usage: wasm_shell <file.js>\n");
                  return 1;
              }

              v8::V8::InitializeICU();
              std::unique_ptr<v8::Platform> platform = v8::platform::NewDefaultPlatform();
              v8::V8::InitializePlatform(platform.get());
              v8::V8::Initialize();

              v8::Isolate::CreateParams create_params;
              create_params.array_buffer_allocator = v8::ArrayBuffer::Allocator::NewDefaultAllocator();
              v8::Isolate* isolate = v8::Isolate::New(create_params);

              {
                  v8::Isolate::Scope isolate_scope(isolate);
                  v8::HandleScope handle_scope(isolate);

                  v8::Local<v8::ObjectTemplate> global = v8::ObjectTemplate::New(isolate);

                  global->Set(isolate, "print", v8::FunctionTemplate::New(isolate, [](const v8::FunctionCallbackInfo<v8::Value>& args) {
                      v8::Isolate* iso = args.GetIsolate();
                      v8::HandleScope hs(iso);
                      for (int i = 0; i < args.Length(); i++) {
                          v8::String::Utf8Value utf8(iso, args[i]);
                          printf("%s%s", *utf8, i == args.Length() - 1 ? "" : " ");
                      }
                      printf("\n");
                  }));

                  v8::Local<v8::ObjectTemplate> os = v8::ObjectTemplate::New(isolate);
                  os->Set(isolate, "readStdinBytes", v8::FunctionTemplate::New(isolate, v8::Shell::ReadStdinBytes));
                  os->Set(isolate, "writeStdoutBytes", v8::FunctionTemplate::New(isolate, v8::Shell::WriteStdoutBytes));
                  global->Set(isolate, "os", os);

                  v8::Local<v8::Context> context = v8::Context::New(isolate, nullptr, global);
                  v8::Context::Scope context_scope(context);

                  FILE* file = fopen(argv[1], "rb");
                  if (!file) {
                      fprintf(stderr, "Error opening script file: %s\n", argv[1]);
                      return 1;
                  }
                  fseek(file, 0, SEEK_END);
                  size_t size = ftell(file);
                  rewind(file);
                  char* chars = new char[size + 1];
                  chars[size] = '\0';
                  size_t read_bytes = fread(chars, 1, size, file);
                  fclose(file);

                  v8::Local<v8::String> source = v8::String::NewFromUtf8(isolate, chars, v8::NewStringType::kNormal, read_bytes).ToLocalChecked();
                  delete[] chars;

                  v8::Local<v8::Script> script;
                  if (v8::Script::Compile(context, source).ToLocalChecked(&script)) {
                      v8::MaybeLocal<v8::Value> result = script->Run(context);
                  }
              }

              isolate->Dispose();
              v8::V8::Dispose();
              v8::V8::DisposePlatform();
              delete create_params.array_buffer_allocator;
              return 0;
          }
          EOF


      - name: Cross-Compile Standalone WASM Shell
        run: |
          WASI_CLANG="$(pwd)/wasi-sdk-25.0-x86_64-linux/bin/clang++"
          WASI_SYSROOT="$(pwd)/wasi-sdk-25.0-x86_64-linux/share/wasi-sysroot"
          
          # FIXED: Updated the object path parameter to load natively from obj/src/d8/d8.o
          $WASI_CLANG -O3 -std=c++20 \
            --target=wasm32-wasi \
            --sysroot=$WASI_SYSROOT \
            -DV8_SUPPORTS_SOURCE_LOCATION=0 \
            -DV8_TARGET_ARCH_IA32 \
            -D_LIBCPP_HAS_NO_THREADS \
            -I./v8/include \
            -I./v8 \
            -I./v8/third_party/abseil-cpp \
            -I./v8/out/wasm.release/gen \
            v8/src/d8/wasm_shell.cc \
            v8/out/wasm.release/obj/src/d8/d8.o \
            -L./v8/out/wasm.release/obj \
            -Wl,--allow-undefined \
            -lv8_monolith \
            -o d8.wasm

      - name: Upload Standalone d8 WASM Binary
        uses: actions/upload-artifact@v4
        with:
          name: d8-wasm-module
          path: d8.wasm
